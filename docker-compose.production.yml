    hostname: chat-service
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=metachat
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SERVER_PORT=8080
      - GRPC_PORT=50055
    ports:
      - "50055:50055"
    networks:
      - metachat_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mood-analysis-service:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-username/metachat}-mood-analysis-service:${TAG:-latest}
    hostname: mood-analysis-service
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=metachat
    ports:
      - "8000:8000"
      - "50056:50056"
    networks:
      - metachat_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
