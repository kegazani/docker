  biometric-service:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-username/metachat}-biometric-service:${TAG:-latest}
    hostname: biometric-service
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=metachat
    ports:
      - "8003:8000"
    networks:
      - metachat_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  correlation-service:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-username/metachat}-correlation-service:${TAG:-latest}
    hostname: correlation-service
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=metachat
    ports:
      - "8004:8000"
    networks:
      - metachat_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  metachat_network:
    external: true

